name: Publish MCP server

# Push a tag like mcp-v1.0.1 (matching packages/mcp-server/package.json) to publish.
# Uses npm Trusted Publishing (OIDC). The very first publish (before the package exists on npm)
# falls back to a temporary NPM_TOKEN repo secret; delete that secret afterwards.
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 is needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --filter @pixmeter/mcp-server
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "mcp-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
